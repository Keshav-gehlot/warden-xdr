# sshd, PAM, sudo, su and account management rules.

# ---------------- sshd ----------------
- id: 5700
  level: 0
  decoded_as: sshd
  description: SSHD messages grouped
  groups: [sshd]

- id: 5701
  if_sid: [5700]
  level: 8
  match: 'Bad protocol version identification|ssh-scan|Protocol major versions differ'
  description: 'sshd: Possible attack on the ssh server (or version gathering)'
  groups: [recon]
  mitre: [T1595]

- id: 5706
  if_sid: [5700]
  level: 6
  match: 'Did not receive identification string'
  description: 'sshd: Did not receive identification string (scanner)'
  groups: [recon]
  mitre: [T1046]

- id: 5710
  if_sid: [5700]
  level: 5
  match: 'Invalid user|invalid user'
  description: 'sshd: Attempt to login using a non-existent user'
  groups: [authentication_failed, invalid_login]
  mitre: [T1110.001, T1021.004]
  compliance: {pci_dss: ['10.2.4', '10.2.5'], gdpr: ['IV_35.7.d'], nist_800_53: ['AU.14', 'AC.7']}

- id: 5716
  if_sid: [5700]
  level: 5
  field: {action: '^Failed$'}
  description: 'sshd: Authentication failed'
  groups: [authentication_failed]
  mitre: [T1110.001, T1021.004]
  compliance: {pci_dss: ['10.2.4', '10.2.5'], nist_800_53: ['AU.14', 'AC.7']}

- id: 5717
  if_sid: [5716]
  level: 7
  field: {dstuser: '^root$'}
  description: 'sshd: Authentication failed for root'
  groups: [authentication_failed]
  mitre: [T1110.001, T1078]

- id: 5715
  if_sid: [5700]
  level: 3
  field: {action: '^Accepted$'}
  description: 'sshd: Authentication success'
  groups: [authentication_success]
  mitre: [T1078, T1021.004]
  compliance: {pci_dss: ['10.2.5'], nist_800_53: ['AU.14', 'AC.7']}

- id: 5718
  if_sid: [5715]
  level: 8
  field: {dstuser: '^root$'}
  description: 'sshd: Direct root login accepted'
  groups: [authentication_success]
  mitre: [T1078]

- id: 5758
  if_sid: [5700]
  level: 8
  match: 'maximum authentication attempts exceeded'
  description: 'sshd: Maximum authentication attempts exceeded'
  groups: [authentication_failed]
  mitre: [T1110]

- id: 5712
  level: 10
  if_matched_sid: 5710
  frequency: 6
  timeframe: 120
  same_field: [srcip]
  description: 'sshd: Brute force trying to get access to the system (non-existent users)'
  groups: [authentication_failures, brute_force]
  mitre: [T1110]
  compliance: {pci_dss: ['11.4', '10.2.4'], nist_800_53: ['SI.4', 'AU.14']}
  active_response: {command: firewall-drop, timeout: 600, field: srcip}

- id: 5720
  level: 10
  if_matched_group: authentication_failed
  frequency: 8
  timeframe: 120
  same_field: [srcip]
  description: 'Multiple authentication failures from the same source'
  groups: [authentication_failures, brute_force]
  mitre: [T1110]
  compliance: {pci_dss: ['11.4', '10.2.4'], nist_800_53: ['SI.4', 'AU.14']}
  active_response: {command: firewall-drop, timeout: 600, field: srcip}

# ---------------- PAM ----------------
- id: 5500
  level: 0
  decoded_as: pam
  description: PAM messages grouped
  groups: [pam]

- id: 5501
  if_sid: [5500]
  level: 3
  field: {pam_event: '^session opened$'}
  description: 'PAM: Login session opened'
  groups: [authentication_success]
  compliance: {pci_dss: ['10.2.5'], nist_800_53: ['AU.14']}

- id: 5502
  if_sid: [5500]
  level: 3
  field: {pam_event: '^session closed$'}
  description: 'PAM: Login session closed'

- id: 5503
  if_sid: [5500]
  level: 5
  field: {pam_event: '^authentication failure$'}
  description: 'PAM: User login failed'
  groups: [authentication_failed]
  mitre: [T1110.001]
  compliance: {pci_dss: ['10.2.4'], nist_800_53: ['AC.7']}

# ---------------- sudo ----------------
- id: 5400
  level: 0
  decoded_as: sudo
  description: sudo messages grouped
  groups: [sudo]

- id: 5402
  if_sid: [5400]
  level: 3
  field: {dstuser: '^root$', command: '.'}
  not_match: 'incorrect password|NOT in sudoers|command not allowed'
  description: 'Successful sudo to ROOT executed'
  mitre: [T1548.003]
  compliance: {pci_dss: ['10.2.5', '10.2.2'], nist_800_53: ['AC.6']}

- id: 5404
  if_sid: [5402]
  level: 12
  match: '(?i)COMMAND=.*(/bin/(ba|z|da)?sh\b|nc .*-e|/dev/tcp/|curl .*\| *(ba)?sh|wget .*\| *(ba)?sh|chmod \+s|base64 -d)'
  description: 'sudo used to spawn a shell or run a suspicious command'
  mitre: [T1548.003, T1059.004]

- id: 5401
  if_sid: [5400]
  level: 5
  match: 'incorrect password attempt'
  description: 'sudo: Incorrect password attempt'
  groups: [authentication_failed]
  mitre: [T1548.003, T1110.001]

- id: 5405
  if_sid: [5400]
  level: 10
  match: 'user NOT in sudoers|is not in the sudoers file'
  description: 'Unauthorized user attempted to use sudo'
  mitre: [T1548.003]
  compliance: {pci_dss: ['10.2.2', '10.2.5'], nist_800_53: ['AC.6', 'AC.7']}

# ---------------- su ----------------
- id: 5300
  level: 0
  decoded_as: su
  description: su messages grouped
  groups: [su]

- id: 5301
  if_sid: [5300]
  level: 5
  match: '(?i)FAILED su|authentication failure'
  description: 'User missed the password to change UID (user id)'
  groups: [authentication_failed]
  mitre: [T1548.003]

- id: 5303
  if_sid: [5300]
  level: 3
  field: {dstuser: '^root$'}
  not_match: '(?i)FAILED'
  description: 'User successfully changed UID to root'
  mitre: [T1078]

# ---------------- account management ----------------
- id: 5900
  level: 0
  decoded_as: account-mgmt
  description: Account management messages

- id: 5902
  if_sid: [5900]
  level: 8
  match: 'new user:'
  description: 'New user added to the system'
  groups: [adduser]
  mitre: [T1136.001]
  compliance: {pci_dss: ['10.2.7', '10.2.5', '8.1.2'], nist_800_53: ['AC.2', 'IA.4']}

- id: 5903
  if_sid: [5900]
  level: 8
  match: 'delete user'
  description: 'User account deleted'
  groups: [userdel]
  mitre: [T1531]
  compliance: {pci_dss: ['10.2.7', '8.1.4'], nist_800_53: ['AC.2']}

- id: 5904
  if_sid: [5900]
  level: 8
  match: 'new group:'
  description: 'New group added to the system'
  mitre: [T1136.001]

- id: 5905
  if_sid: [5900]
  level: 8
  match: "to group '(sudo|wheel|admin|root|docker)'"
  description: 'User added to a privileged group'
  mitre: [T1098, T1548.003]

- id: 5906
  if_sid: [5900]
  level: 3
  match: 'password'
  description: 'User password changed'
  mitre: [T1098]
