# Rules for events generated by warden itself and by agent modules.
# Rule IDs mirror Wazuh's where an equivalent exists.

# ---- agent lifecycle (type: agent) ----
- id: 500
  level: 0
  type: agent
  description: Agent lifecycle messages
  groups: [warden, agent]

- id: 501
  if_sid: [500]
  level: 3
  field: {event: '^started$'}
  description: 'Warden agent started'
  groups: [agent_start]

- id: 502
  if_sid: [500]
  level: 3
  field: {event: '^stopped$'}
  description: 'Warden agent stopped'
  groups: [agent_stop]

- id: 504
  if_sid: [500]
  level: 6
  field: {event: '^disconnected$'}
  description: 'Warden agent disconnected (no keepalive for 60s)'
  groups: [agent_disconnected]
  mitre: [T1562.001]

- id: 505
  if_sid: [500]
  level: 3
  field: {event: '^enrolled$'}
  description: 'New agent enrolled'
  groups: [agent_enroll]

# ---- file integrity monitoring (type: syscheck) ----
- id: 550
  level: 7
  decoded_as: syscheck
  field: {event: '^modified$'}
  description: 'Integrity checksum changed'
  groups: [syscheck, syscheck_entry_modified]
  mitre: [T1565.001]
  compliance: {pci_dss: ['11.5'], gdpr: ['II_5.1.f'], nist_800_53: ['SI.7']}

- id: 553
  level: 7
  decoded_as: syscheck
  field: {event: '^deleted$'}
  description: 'File deleted'
  groups: [syscheck, syscheck_entry_deleted]
  mitre: [T1485, T1070.002]
  compliance: {pci_dss: ['11.5'], nist_800_53: ['SI.7']}

- id: 554
  level: 5
  decoded_as: syscheck
  field: {event: '^added$'}
  description: 'File added to the system'
  groups: [syscheck, syscheck_entry_added]
  compliance: {pci_dss: ['11.5'], nist_800_53: ['SI.7']}

- id: 555
  if_sid: [550, 553, 554]
  level: 12
  field: {path: '^/etc/(passwd|shadow|gshadow|group|sudoers)$|^/etc/sudoers\.d/'}
  description: 'Critical account/privilege file changed'
  groups: [syscheck_critical]
  mitre: [T1098, T1003.008]
  compliance: {pci_dss: ['10.2.5', '11.5'], nist_800_53: ['AC.2', 'SI.7']}

- id: 556
  if_sid: [550, 554]
  level: 12
  field: {path: '/\.ssh/authorized_keys2?$'}
  description: 'SSH authorized_keys modified'
  groups: [syscheck_critical]
  mitre: [T1098.004]

- id: 557
  if_sid: [550, 554]
  level: 10
  field: {path: '^/etc/(cron\.|crontab)|^/var/spool/cron/'}
  description: 'Cron configuration changed'
  groups: [syscheck_critical]
  mitre: [T1053.003]

- id: 558
  if_sid: [550, 554]
  level: 10
  field: {path: '^/(etc|lib|usr/lib)/systemd/system/.*\.service$'}
  description: 'Systemd unit file created or modified'
  groups: [syscheck_critical]
  mitre: [T1543.002]

- id: 559
  if_sid: [550, 554]
  level: 12
  field: {path: '^/(usr/)?s?bin/'}
  description: 'System binary changed (possible trojan)'
  groups: [syscheck_critical]
  mitre: [T1014]

# ---- security configuration assessment (type: sca) ----
- id: 19000
  level: 0
  decoded_as: sca
  description: SCA messages
  groups: [sca]

- id: 19004
  if_sid: [19000]
  level: 7
  field: {result: '^failed$', previous_result: '^(|passed|not applicable)$'}
  description: 'SCA check failed'
  groups: [sca_failed]

- id: 19005
  if_sid: [19000]
  level: 3
  field: {result: '^passed$', previous_result: '^failed$'}
  description: 'SCA check now passing (was failing)'
  groups: [sca_fixed]

# ---- vulnerability detector (generated by manager) ----
- id: 23500
  level: 0
  decoded_as: vulnerability-detector
  description: Vulnerability detector messages
  groups: [vulnerability-detector]

- id: 23501
  if_sid: [23500]
  level: 3
  field: {severity: '^(Low|Unknown)$'}
  description: 'Low severity vulnerability detected'

- id: 23502
  if_sid: [23500]
  level: 7
  field: {severity: '^Medium$'}
  description: 'Medium severity vulnerability detected'

- id: 23503
  if_sid: [23500]
  level: 10
  field: {severity: '^High$'}
  description: 'High severity vulnerability detected'
  compliance: {pci_dss: ['11.2.1', '11.2.3'], nist_800_53: ['RA.5']}

- id: 23504
  if_sid: [23500]
  level: 13
  field: {severity: '^Critical$'}
  description: 'Critical severity vulnerability detected'
  compliance: {pci_dss: ['11.2.1', '11.2.3'], nist_800_53: ['RA.5']}

# ---- active response results ----
- id: 650
  level: 0
  decoded_as: active_response
  description: Active response messages
  groups: [active_response]

- id: 651
  if_sid: [650]
  level: 3
  field: {status: '^ok$'}
  description: 'Active response executed'

- id: 652
  if_sid: [650]
  level: 6
  field: {status: '^(failed|error)$'}
  description: 'Active response failed'

- id: 653
  if_sid: [650]
  level: 3
  field: {status: '^reverted$'}
  description: 'Active response reverted (timeout expired)'

# ---- rootcheck / anomaly detection ----
- id: 510
  level: 7
  decoded_as: rootcheck
  description: 'Host-based anomaly detection event (rootcheck)'
  groups: [rootcheck]
  mitre: [T1014]

- id: 511
  if_sid: [510]
  level: 12
  field: {check: '^(hidden_process|trojaned_binary|rootkit_file)$'}
  description: 'Possible rootkit or trojaned binary detected'
  mitre: [T1014, T1564.001]

- id: 512
  if_sid: [510]
  level: 10
  field: {check: '^promisc$'}
  description: 'Network interface in promiscuous mode'

# ---- command monitoring ----
- id: 530
  level: 0
  type: command
  description: Command monitoring output

- id: 533
  if_sid: [530]
  level: 7
  field: {alias: '^listening-ports$', changed: '^yes$'}
  description: 'Listening ports status changed (new port opened or closed)'
  mitre: [T1046]
  groups: [command_change]

- id: 534
  if_sid: [530]
  level: 5
  field: {changed: '^yes$'}
  description: 'Monitored command output changed'
  groups: [command_change]
