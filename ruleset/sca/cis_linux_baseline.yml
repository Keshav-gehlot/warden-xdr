# Linux hardening baseline, modelled on CIS Distribution Independent Linux.
# Rule syntax is compatible with Wazuh SCA policies (f:, d:, c:, p:, r:, n:, not).

policy:
  id: cis_linux_baseline
  name: CIS-style Linux baseline (warden)
  description: Core SSH, account, kernel and filesystem hardening checks for Linux hosts.

requirements:
  title: Linux host
  condition: any
  rules:
    - 'f:/etc/passwd'

checks:
  - id: 1001
    title: Ensure SSH root login is disabled
    rationale: Direct root logins remove accountability and are the primary brute-force target.
    remediation: Set "PermitRootLogin no" in /etc/ssh/sshd_config and reload sshd.
    compliance: {cis: ['5.2.10'], pci_dss: ['2.2.4'], nist_800_53: ['AC.6']}
    condition: all
    rules:
      - 'f:/etc/ssh/sshd_config -> r:^\s*PermitRootLogin\s+no'

  - id: 1002
    title: Ensure SSH password authentication is disabled
    rationale: Key-based authentication is resistant to password guessing.
    remediation: Set "PasswordAuthentication no" in /etc/ssh/sshd_config.
    compliance: {cis: ['5.2.12'], nist_800_53: ['IA.2']}
    condition: all
    rules:
      - 'f:/etc/ssh/sshd_config -> r:^\s*PasswordAuthentication\s+no'

  - id: 1003
    title: Ensure SSH MaxAuthTries is set to 4 or less
    rationale: Limits brute-force attempts per connection.
    remediation: Set "MaxAuthTries 4" in /etc/ssh/sshd_config.
    compliance: {cis: ['5.2.7']}
    condition: all
    rules:
      - 'f:/etc/ssh/sshd_config -> n:^\s*MaxAuthTries\s+(\d+) compare <= 4'

  - id: 1004
    title: Ensure SSH X11 forwarding is disabled
    rationale: X11 forwarding exposes the client display to the server.
    remediation: Set "X11Forwarding no" in /etc/ssh/sshd_config.
    compliance: {cis: ['5.2.6']}
    condition: none
    rules:
      - 'f:/etc/ssh/sshd_config -> r:^\s*X11Forwarding\s+yes'

  - id: 1005
    title: Ensure no accounts other than root have UID 0
    rationale: Any UID 0 account has full superuser rights.
    remediation: Remove or re-number every non-root account with UID 0.
    compliance: {cis: ['6.2.6'], pci_dss: ['8.1'], nist_800_53: ['AC.6']}
    condition: none
    rules:
      - 'f:/etc/passwd -> !r:^root: && r:^[^:]*:[^:]*:0:'

  - id: 1006
    title: Ensure password fields are not empty
    rationale: An account with an empty password can be used without authentication.
    remediation: Lock or set a password for every account (passwd -l <user>).
    compliance: {cis: ['6.2.1'], pci_dss: ['8.2']}
    condition: none
    rules:
      - 'f:/etc/shadow -> r:^[^:]+::'

  - id: 1007
    title: Ensure permissions on /etc/shadow are restrictive
    rationale: Password hashes must not be readable by unprivileged users.
    remediation: chmod 640 /etc/shadow (or 600) and chown root:shadow /etc/shadow.
    compliance: {cis: ['6.1.3']}
    condition: none
    rules:
      - 'c:stat -c %a /etc/shadow -> r:^[0-7][2367][0-7]$|^[0-7][0-7][1-7]$'

  - id: 1008
    title: Ensure IP forwarding is disabled
    rationale: Hosts that are not routers should not forward packets.
    remediation: Set net.ipv4.ip_forward = 0 in /etc/sysctl.conf and run sysctl -p.
    compliance: {cis: ['3.1.1'], nist_800_53: ['CM.7']}
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/ip_forward -> r:^0$'

  - id: 1009
    title: Ensure ASLR is enabled
    rationale: Address space layout randomisation makes memory-corruption exploits harder.
    remediation: Set kernel.randomize_va_space = 2 in /etc/sysctl.conf.
    compliance: {cis: ['1.5.3']}
    condition: all
    rules:
      - 'f:/proc/sys/kernel/randomize_va_space -> r:^2$'

  - id: 1010
    title: Ensure ICMP redirects are not accepted
    rationale: Redirects can be used to reroute traffic through an attacker.
    remediation: Set net.ipv4.conf.all.accept_redirects = 0.
    compliance: {cis: ['3.3.2']}
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/conf/all/accept_redirects -> r:^0$'

  - id: 1011
    title: Ensure TCP SYN cookies are enabled
    rationale: Mitigates SYN flood denial-of-service attacks.
    remediation: Set net.ipv4.tcp_syncookies = 1.
    compliance: {cis: ['3.3.8']}
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/tcp_syncookies -> r:^1$'

  - id: 1012
    title: Ensure auditd is running
    rationale: The audit daemon records security-relevant system calls.
    remediation: Install auditd and enable it (systemctl enable --now auditd).
    compliance: {cis: ['4.1.1.2'], pci_dss: ['10.1'], nist_800_53: ['AU.2']}
    condition: any
    rules:
      - 'p:^auditd$'

  - id: 1013
    title: Ensure telnet and rsh servers are not installed
    rationale: These protocols send credentials in clear text.
    remediation: Remove telnetd, rsh-server and inetd packages.
    compliance: {cis: ['2.2.18'], pci_dss: ['2.2.2']}
    condition: none
    rules:
      - 'f:/usr/sbin/in.telnetd'
      - 'f:/usr/sbin/in.rshd'

  - id: 1014
    title: Ensure /tmp is a separate mount with noexec
    rationale: Prevents execution of attacker-dropped binaries in /tmp.
    remediation: Mount /tmp as tmpfs with nodev,nosuid,noexec.
    compliance: {cis: ['1.1.2', '1.1.5']}
    condition: all
    rules:
      - 'f:/proc/mounts -> r:\s/tmp\s && r:noexec'

  - id: 1015
    title: Ensure a firewall is active
    rationale: A host firewall limits exposure of listening services.
    remediation: Enable ufw, firewalld or an nftables ruleset.
    compliance: {cis: ['3.5.1'], pci_dss: ['1.4']}
    condition: any
    rules:
      - 'c:ufw status 2>/dev/null -> r:Status: active'
      - 'c:firewall-cmd --state 2>/dev/null -> r:^running'
      - 'c:nft list ruleset 2>/dev/null -> r:hook input'

  - id: 1016
    title: Ensure core dumps are restricted
    rationale: Core dumps of setuid programs can leak sensitive memory.
    remediation: Set fs.suid_dumpable = 0.
    compliance: {cis: ['1.5.1']}
    condition: all
    rules:
      - 'f:/proc/sys/fs/suid_dumpable -> r:^0$'
